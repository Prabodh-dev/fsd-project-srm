<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/public-shell :: shell('Request problem', ~{::content})}">
<body>
<th:block th:fragment="content">
    <section class="error-page">
        <p class="error-code">400</p>
        <h1>Request problem</h1>
        <p>The request could not be completed. Please go back and try again.</p>
        <div class="btn-row" style="justify-content:center">
            <a class="btn btn-primary" th:href="@{/dashboard}">Go to dashboard</a>
            <a class="btn" th:href="@{/}">Home page</a>
        </div>
    </section>
</th:block>
</body>
</html>
