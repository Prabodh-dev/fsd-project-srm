spring.application.name=examedge
server.port=8080
server.servlet.session.timeout=60m
server.error.whitelabel.enabled=false
spring.datasource.url=jdbc:h2:file:./data/examedge
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.thymeleaf.cache=false
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=1MB
logging.level.root=INFO
logging.level.dev.prabodh.examedge=INFO
logging.level.org.hibernate.SQL=WARN
examedge.exam.submit-grace-seconds=5
examedge.security.max-failed-logins=5
examedge.security.lockout-minutes=10
