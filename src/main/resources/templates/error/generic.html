<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/public-shell :: shell(${title}, ~{::content})}">
<body>
<th:block th:fragment="content">
    <section class="error-page">
        <p class="error-code" th:text="${status}">500</p>
        <h1 th:text="${title}">Something went wrong</h1>
        <p th:text="${message}">Message</p>
        <div class="btn-row" style="justify-content:center">
            <a class="btn btn-primary" th:href="@{/dashboard}">Go to dashboard</a>
            <a class="btn" th:href="@{/}">Home page</a>
        </div>
    </section>
</th:block>
</body>
</html>
