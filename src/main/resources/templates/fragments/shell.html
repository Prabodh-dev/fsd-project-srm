<!DOCTYPE html>
<html lang="en" th:fragment="shell(title, active, content, scripts)" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/parts :: head(${title})}"></head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div class="app-shell">
    <aside th:replace="~{fragments/parts :: sidebar(${active})}"></aside>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
    <div class="app-main">
        <header th:replace="~{fragments/parts :: topbar}"></header>
        <main id="main" class="content" tabindex="-1">
            <div th:replace="~{fragments/parts :: flash}"></div>
            <th:block th:replace="${content}"></th:block>
        </main>
        <footer th:replace="~{fragments/parts :: footer}"></footer>
    </div>
</div>
<dialog th:replace="~{fragments/parts :: confirmDialog}"></dialog>
<script th:src="@{/js/app.js}"></script>
<th:block th:each="script : ${#strings.arraySplit(scripts, ' ')}">
    <script th:if="${!#strings.isEmpty(script)}" th:src="@{/js/{name}(name=${script})}"></script>
</th:block>
</body>
</html>
