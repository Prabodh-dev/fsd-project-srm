<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/shell :: shell('All exams', 'exams', ~{::content}, '')}">
<body>
<th:block th:fragment="content">
    <div class="page-header">
        <div>
            <h1>All exams</h1>
            <p>Review every exam on the platform and remove inappropriate ones.</p>
        </div>
    </div>
    <form class="toolbar" th:action="@{/admin/exams}" method="get" role="search">
        <div class="field grow">
            <label for="q">Search by title</label>
            <input id="q" name="q" type="search" th:value="${q}">
        </div>
        <button type="submit" class="btn btn-primary">Search</button>
    </form>
    <div class="table-wrap" th:if="${exams.hasContent()}">
        <table class="table">
            <thead>
            <tr><th scope="col">Exam</th><th scope="col">Teacher</th><th scope="col">Status</th><th scope="col">Window</th><th scope="col" class="num">Questions</th><th scope="col" class="num">Attempts</th><th scope="col">Actions</th></tr>
            </thead>
            <tbody>
            <tr th:each="e : ${exams.content}">
                <td class="cell-title" th:text="${e.title}">Title</td>
                <td th:text="${e.teacherName}">Teacher</td>
                <td><span class="badge" th:classappend="'badge-' + ${e.status.badgeClass}" th:text="${e.status.label}">Live</span></td>
                <td><span th:text="${#temporals.format(e.startTime, 'dd MMM yyyy HH:mm')}"></span> to <span th:text="${#temporals.format(e.endTime, 'dd MMM yyyy HH:mm')}"></span></td>
                <td class="num" th:text="${e.questionCount}">0</td>
                <td class="num" th:text="${e.attemptCount}">0</td>
                <td>
                    <form th:action="@{/admin/exams/{id}/delete(id=${e.id})}" method="post" class="inline-form"
                          th:attr="data-confirm='Remove the exam ' + ${e.title} + ' together with all of its attempts?'">
                        <button type="submit" class="btn btn-small btn-danger">Remove</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <div class="card empty-state" th:unless="${exams.hasContent()}">
        <h3>No exams found</h3>
        <p>Exams created by teachers appear here.</p>
    </div>
    <div th:replace="~{fragments/parts :: pagination(${exams}, '/admin/exams', ${extraQuery})}"></div>
</th:block>
</body>
</html>
