<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/shell :: shell('Results', 'dashboard', ~{::content}, '')}">
<body>
<th:block th:fragment="content">
    <div class="page-header">
        <div>
            <h1 th:text="${exam.title} + ' - results'">Results</h1>
            <p th:text="${exam.attemptCount} + ' attempts, pass mark ' + ${exam.passingPercentage} + '%'"></p>
        </div>
        <div class="btn-row">
            <a class="btn" th:href="@{/teacher/exams/{id}/analytics(id=${exam.id})}">Analytics</a>
            <a class="btn btn-primary" th:href="@{/teacher/exams/{id}/results.csv(id=${exam.id})}">Export CSV</a>
            <a class="btn" th:href="@{/teacher}">Back to exams</a>
        </div>
    </div>
    <form class="toolbar" th:action="@{/teacher/exams/{id}/results(id=${exam.id})}" method="get" role="search">
        <div class="field grow">
            <label for="q">Search by student name or email</label>
            <input id="q" name="q" type="search" th:value="${q}">
        </div>
        <button type="submit" class="btn btn-primary">Search</button>
    </form>
    <div class="table-wrap" th:if="${attempts.hasContent()}">
        <table class="table">
            <thead>
            <tr><th scope="col">Student</th><th scope="col" class="num">Score</th><th scope="col" class="num">Percentage</th><th scope="col">Result</th><th scope="col">Status</th><th scope="col">Time taken</th><th scope="col">Submitted</th><th scope="col">Details</th></tr>
            </thead>
            <tbody>
            <tr th:each="a : ${attempts.content}">
                <td><div class="cell-title" th:text="${a.studentName}">Name</div><div class="cell-sub" th:text="${a.studentEmail}">email</div></td>
                <td class="num" th:text="${a.score} + ' / ' + ${a.totalMarks}">0 / 0</td>
                <td class="num" th:text="${a.percentage} + '%'">0%</td>
                <td>
                    <span class="badge badge-success" th:if="${a.passed}">Pass</span>
                    <span class="badge badge-danger" th:unless="${a.passed}">Fail</span>
                </td>
                <td><span class="badge badge-neutral" th:text="${a.status == T(dev.prabodh.examedge.entity.AttemptStatus).AUTO_SUBMITTED} ? 'Auto submitted' : 'Submitted'">Submitted</span></td>
                <td th:text="${a.timeTakenText}">0m</td>
                <td th:text="${#temporals.format(a.submittedAt, 'dd MMM yyyy HH:mm')}">date</td>
                <td><a class="btn btn-small" th:href="@{/teacher/attempts/{id}(id=${a.attemptId})}">View</a></td>
            </tr>
            </tbody>
        </table>
    </div>
    <div class="card empty-state" th:unless="${attempts.hasContent()}">
        <h3 th:text="${#strings.isEmpty(q)} ? 'No submissions yet' : 'No results match your search'">Empty</h3>
        <p th:if="${#strings.isEmpty(q)}">Results appear here as soon as students submit this exam.</p>
    </div>
    <div th:replace="~{fragments/parts :: pagination(${attempts}, '/teacher/exams/' + ${exam.id} + '/results', ${extraQuery})}"></div>
</th:block>
</body>
</html>
