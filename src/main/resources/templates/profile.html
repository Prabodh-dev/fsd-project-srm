<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/shell :: shell('Profile', 'profile', ~{::content}, '')}">
<body>
<th:block th:fragment="content">
    <div class="page-header">
        <div>
            <h1>Profile</h1>
            <p th:text="${account.email} + ' - ' + ${account.role}">email</p>
        </div>
    </div>
    <div class="grid grid-2">
        <section class="card" aria-labelledby="name-title">
            <h2 id="name-title">Your name</h2>
            <form th:action="@{/profile/name}" th:object="${profileForm}" method="post" novalidate>
                <div class="field" th:classappend="${#fields.hasErrors('fullName')} ? 'has-error'">
                    <label for="fullName">Full name</label>
                    <input id="fullName" type="text" th:field="*{fullName}" required>
                    <p class="field-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></p>
                </div>
                <button type="submit" class="btn btn-primary">Save name</button>
            </form>
        </section>
        <section class="card" aria-labelledby="password-title">
            <h2 id="password-title">Change password</h2>
            <form th:action="@{/profile/password}" th:object="${passwordForm}" method="post" novalidate>
                <div class="field" th:classappend="${#fields.hasErrors('currentPassword')} ? 'has-error'">
                    <label for="currentPassword">Current password</label>
                    <input id="currentPassword" type="password" th:field="*{currentPassword}" autocomplete="current-password" required>
                    <p class="field-error" th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}"></p>
                </div>
                <div class="field" th:classappend="${#fields.hasErrors('newPassword')} ? 'has-error'">
                    <label for="newPassword">New password</label>
                    <input id="newPassword" type="password" th:field="*{newPassword}" autocomplete="new-password" required>
                    <p class="field-error" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></p>
                </div>
                <div class="field" th:classappend="${#fields.hasErrors('confirmPassword')} ? 'has-error'">
                    <label for="confirmPassword">Confirm new password</label>
                    <input id="confirmPassword" type="password" th:field="*{confirmPassword}" autocomplete="new-password" required>
                    <p class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></p>
                </div>
                <button type="submit" class="btn btn-primary">Change password</button>
            </form>
        </section>
    </div>
</th:block>
</body>
</html>
